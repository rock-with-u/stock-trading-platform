spring:
  application:
    name: market-service

  datasource:
    url: jdbc:mariadb://localhost:${DB_PORT}/${DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  data:
    redis:
      host: localhost
      port: ${REDIS_PORT}
      timeout: 2s

server:
  port: ${SERVER_PORT}

kis:
  app-key: ${KIS_APP_KEY}
  app-secret: ${KIS_APP_SECRET}
  rest-base-url: https://openapivts.koreainvestment.com:29443
  websocket:
    websocket-url: ws://ops.koreainvestment.com:31000

